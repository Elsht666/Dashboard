<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>快捷导航</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        :root {
            --bg: #2a2a32;
            --fg: #e6e6e6;
            --muted: #a3adba;
            --card: #5b9bd5;
            --card-hover: #7ab4e8;
            --accent: #4f8cff;
            --shadow: 0 10px 30px rgba(0, 0, 0, .25);
            --radius: 18px;
            --card-scale: 1;
            --card-min-width: 160px;
            --card-row-height: 120px;
            --card-favicon-size: 32px;
            --card-title-size: 14px;
            --card-host-size: 11px;
            --card-gap: 16px;
            --grid-padding: 50px 18px 80px;
        }

        [data-theme="light"] {
            --bg: #F1F1ED;
            --fg: #1a1d24;
            --muted: #4d5561;
            --card: #5b9bd5;
            --card-hover: #4a8bc5;
            --accent: #84CC16;
            --shadow: 0 12px 28px rgba(0, 0, 0, .08);
        }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans",
                "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg) fixed center/cover no-repeat;
            color: var(--fg);
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 14px;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            flex-wrap: wrap;
        }

        header h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }

        .spacer { flex: 1; }

        .toolbar {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            appearance: none;
            border: 0;
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            background: var(--card);
            color: #fff;
            box-shadow: var(--shadow);
            font-weight: 500;
            transition: background .2s, filter .2s, transform .1s;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: scale(0.95); }

        .btn.primary { background: var(--accent); color: white; }
        .btn.primary:hover { filter: brightness(1.05); }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            font-size: 17px;
            line-height: 1;
        }
        @media (max-width: 600px) {
            .btn-icon { width: 36px; height: 36px; font-size: 15px; }
        }

        .size-controls {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(127, 127, 127, .15);
            border-radius: 12px;
            padding: 4px;
        }

        .size-btn {
            appearance: none;
            border: 0;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            background: transparent;
            color: var(--fg);
            font-size: 16px;
            font-weight: 600;
            display: grid;
            place-items: center;
            transition: background .15s, transform .1s;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .size-btn:hover { background: rgba(127, 127, 127, .2); }
        .size-btn:active { transform: scale(0.9); }
        .size-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .switch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            position: relative;
        }

        .switch input {
            appearance: none;
            width: 46px;
            height: 26px;
            border-radius: 999px;
            background: rgba(127, 127, 127, .35);
            position: relative;
            outline: none;
            cursor: pointer;
            transition: background .2s;
            flex-shrink: 0;
        }

        .switch input::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 3px;
            left: 3px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
            transition: transform .2s;
        }

        .switch input:checked { background: var(--accent); }
        .switch input:checked::after { transform: translateX(20px); }

        .switch-label-text {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--fg);
            padding: 4px 8px;
            border-radius: 8px;
            transition: background .15s;
        }

        .switch-label-text:hover { background: rgba(127, 127, 127, .12); }

        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(127, 127, 127, .35);
            flex-shrink: 0;
            transition: transform .15s;
            box-sizing: border-box;
        }

        .switch-label-text:hover .color-dot { transform: scale(1.15); }

        .color-picker-popup {
            position: fixed;
            z-index: 1000;
            background: var(--bg);
            border: 1px solid rgba(127, 127, 127, .25);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
            display: none;
            min-width: 220px;
        }

        .color-picker-popup.show { display: block; }

        .color-picker-popup .preset-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .color-picker-popup .preset-color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform .12s, border-color .12s, box-shadow .12s;
            outline: none;
            padding: 0;
            flex-shrink: 0;
        }

        .color-picker-popup .preset-color-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
            border-color: rgba(255, 255, 255, .6);
        }

        .color-picker-popup .preset-color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, .35);
            transform: scale(1.1);
        }

        .color-picker-popup .popup-label {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: .3px;
        }

        .grid {
            padding: var(--grid-padding);
            width: min(1300px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-min-width), 1fr));
            gap: var(--card-gap);
            align-items: stretch;
            grid-auto-rows: var(--card-row-height);
        }

        .tile {
            user-select: none;
            -webkit-user-select: none;
            background: var(--card);
            border-radius: calc(var(--radius) * var(--card-scale));
            padding: calc(4px * var(--card-scale));
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: calc(2px * var(--card-scale));
            color: #fff;
            position: relative;
            overflow: hidden;
            outline: 2px solid transparent;
            transition: transform .15s ease, outline-color .2s ease, background .2s ease, box-shadow .2s ease;
            box-sizing: border-box;
            height: 100%;
            margin: 0;
            cursor: grab;
            text-decoration: none;
            touch-action: pan-y;
            -webkit-touch-callout: none;
        }

        .tile.sorting {
            touch-action: none;
            cursor: grabbing;
        }

        .tile:hover {
            background: var(--card-hover);
            transform: translateY(calc(-2px * var(--card-scale)));
        }

        .tile.long-press-ready {
            transform: scale(0.95);
            box-shadow: 0 0 0 3px var(--accent), var(--shadow);
        }

        .tile.sorting { cursor: grabbing; }

        .tile:active { transform: translateY(0); }

        .tile.sortable-ghost { opacity: 0.3; background: var(--card-hover); transform: scale(0.92); }
        .tile.sortable-drag { opacity: 0.9; transform: scale(1.05); box-shadow: 0 20px 40px rgba(0,0,0,.4); }

        .favicon {
            width: var(--card-favicon-size);
            height: var(--card-favicon-size);
            border-radius: calc(6px * var(--card-scale));
            display: inline-grid;
            place-items: center;
            margin-left: calc(8px * var(--card-scale));
            margin-top: calc(8px * var(--card-scale));
            flex-shrink: 0;
            overflow: hidden;
        }

        .favicon img {
            width: 100%;
            height: 100%;
            border-radius: calc(6px * var(--card-scale));
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .title {
            font-weight: 600;
            font-size: var(--card-title-size);
            line-height: 1.2;
            text-align: left;
            margin-left: calc(8px * var(--card-scale));
            margin-top: calc(1px * var(--card-scale));
            margin-bottom: calc(4px * var(--card-scale));
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
            pointer-events: none;
        }

        .host {
            color: rgba(255, 255, 255, .75);
            font-size: var(--card-host-size);
            margin-left: calc(8px * var(--card-scale));
            margin-top: calc(4px * var(--card-scale));
            margin-bottom: calc(5px * var(--card-scale));
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .tile .actions {
            position: absolute;
            right: calc(8px * var(--card-scale));
            top: calc(8px * var(--card-scale));
            display: flex;
            gap: calc(6px * var(--card-scale));
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s;
        }

        .tile.actions-visible .actions {
            opacity: 1;
            pointer-events: auto;
        }

        .iconbtn {
            width: calc(30px * var(--card-scale));
            height: calc(30px * var(--card-scale));
            border-radius: calc(10px * var(--card-scale));
            border: 0;
            cursor: pointer;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, .2);
            color: #fff;
            font-size: calc(14px * var(--card-scale));
            touch-action: manipulation;
        }

        .iconbtn:hover { background: rgba(255, 255, 255, .35); }

        .icon { width: calc(18px * var(--card-scale)); height: calc(18px * var(--card-scale)); display: inline-block; pointer-events: none; }

        .fab {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 20;
            border-radius: 18px;
            padding: 14px 16px;
            font-weight: 600;
        }

        dialog {
            border: 0;
            border-radius: 16px;
            background: var(--card);
            color: #fff;
            padding: 0;
            box-shadow: var(--shadow);
            width: min(520px, 92vw);
        }

        dialog::backdrop { background: rgba(0, 0, 0, .45); }

        .dlg-head {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, .2);
            color: #fff;
        }

        .dlg-body { padding: 18px 20px; display: grid; gap: 12px; }

        .dlg-foot {
            padding: 14px 20px 18px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            border-top: 1px solid rgba(255, 255, 255, .2);
        }

        label { font-size: 12px; color: rgba(255, 255, 255, .75); }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .25);
            background: rgba(0, 0, 0, .2);
            color: #fff;
            font-size: 14px;
        }

        input[type="text"]::placeholder,
        input[type="url"]::placeholder { color: rgba(255, 255, 255, .4); }

        .row { display: grid; gap: 8px; }

        .empty { opacity: .6; text-align: center; padding: 40px 20px; font-size: 14px; }

        @media (hover: none) and (pointer: coarse) {
            .tile:hover {
                transform: none;
            }
        }

        /* ==================== 恢复出厂确认弹窗 ==================== */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .confirm-overlay.show { display: flex; }

        .confirm-box {
            background: var(--bg);
            border-radius: 22px;
            padding: 32px 26px 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
            border: 1px solid rgba(127, 127, 127, .15);
            animation: confirmPop .28s cubic-bezier(.175, .885, .32, 1.275);
        }
        [data-theme="light"] .confirm-box {
            background: #fff;
            box-shadow: 0 24px 70px rgba(0, 0, 0, .15);
            border: 1px solid rgba(0, 0, 0, .06);
        }
        @keyframes confirmPop {
            from { transform: translateY(24px) scale(.94); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .confirm-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fef3c7, #fde68a);   /* 浅米黄，感叹号反差最大 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            box-shadow: 0 8px 24px rgba(245, 158, 11, .35);
        }

        .confirm-title {
            font-size: 19px;
            font-weight: 700;
            text-align: center;
            margin: 0 0 10px;
            color: var(--fg);
        }

        .confirm-desc {
            font-size: 13px;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
            margin: 0;
            padding: 0 4px;
        }

        .confirm-desc b { color: var(--fg); font-weight: 600; }

        .confirm-btns {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .confirm-btn {
            flex: 1;
            padding: 12px 0;
            border: 0;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all .2s;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        .confirm-btn:active { transform: scale(0.96); }
        .confirm-btn.cancel {
            background: rgba(127, 127, 127, .12);
            color: var(--muted);
        }
        .confirm-btn.cancel:hover {
            background: rgba(127, 127, 127, .22);
            color: var(--fg);
        }
        [data-theme="light"] .confirm-btn.cancel { background: rgba(0, 0, 0, .05); }
        [data-theme="light"] .confirm-btn.cancel:hover { background: rgba(0, 0, 0, .1); }
        .confirm-btn.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
            box-shadow: 0 6px 20px rgba(239, 68, 68, .35);
        }
        .confirm-btn.danger:hover {
            filter: brightness(1.08);
            box-shadow: 0 8px 26px rgba(239, 68, 68, .45);
        }

        @media (max-width: 600px) {
            .confirm-box { padding: 28px 22px 22px; border-radius: 20px; }
            .confirm-icon { width: 52px; height: 52px; font-size: 24px; }
            .confirm-title { font-size: 18px; }

            /* 手机端：导出/导入按钮同行并排，空间不足时自动换行 */
            .btn-export-import {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .btn-export-import .btn { flex: 1 1 auto; white-space: nowrap; }
        }
    </style>
</head>
<body>
    <header>
        <h1>快捷导航</h1>
        <div class="spacer"></div>
        <div class="toolbar">
            <button class="btn btn-icon" id="btnReloadPage" title="刷新网页">⟳</button>
            <button class="btn" id="btnResetDefaults" title="恢复为HTML源码内置的默认站点列表，无视缓存标记">恢复出厂</button>
            <div class="size-controls" title="调节卡片大小">
                <button class="size-btn" id="btnSizeDown" title="缩小卡片">A−</button>
                <button class="size-btn" id="btnSizeReset" title="重置大小" style="font-size:13px;">A</button>
                <button class="size-btn" id="btnSizeUp" title="放大卡片">A+</button>
            </div>
            <label class="switch" title="切换浅色/深色模式" id="switchContainer">
                <input id="themeToggle" type="checkbox" />
                <span class="switch-label-text" id="colorTrigger" title="点击调节卡片颜色">
                    <span class="color-dot" id="colorDot"></span>
                    <span id="themeLabel">浅色模式</span>
                </span>
                <div class="color-picker-popup" id="colorPickerPopup">
                    <div class="popup-label">选择卡片颜色</div>
                    <div class="preset-colors" id="presetColors"></div>
                </div>
            </label>
            <div class="btn-export-import">
                <button class="btn" id="btnExport" title="导出为JSON备份">导出备份</button>
                <button class="btn" id="btnImport" title="从JSON恢复">导入恢复</button>
            </div>
            <input id="fileImport" type="file" accept="application/json" hidden />
        </div>
    </header>

    <main class="grid" id="grid"></main>
    <button class="btn primary fab" id="btnAdd">＋ 添加快捷站点</button>

    <dialog id="dlg">
        <div class="dlg-head"><strong id="dlgTitle">添加快捷站点</strong><div class="spacer"></div></div>
        <div class="dlg-body">
            <div class="row"><label for="fUrl">网址</label><input id="fUrl" type="url" placeholder="https://example.com" required /></div>
            <div class="row"><label for="fTitle">标题（可选）</label><input id="fTitle" type="text" placeholder="显示在卡片上" /></div>
            <div class="row"><label for="fIcon">图标网址（可选）</label><input id="fIcon" type="url" placeholder="https://site.com/favicon.ico" /></div>
        </div>
        <div class="dlg-foot">
            <button class="btn" id="dlgCancel" type="button">取消</button>
            <button class="btn primary" id="dlgSave" type="button">保存</button>
        </div>
    </dialog>

    <!-- 恢复出厂确认弹窗 -->
    <div class="confirm-overlay" id="confirmOverlay">
        <div class="confirm-box">
            <div class="confirm-icon">⚠️</div>
            <h2 class="confirm-title">恢复出厂设置</h2>
            <p class="confirm-desc">将清除当前所有快捷站点，<br>恢复为 HTML 源码内置的最新<b>默认站点列表</b>。<br>此操作<b>不可撤销</b>，确定继续吗？</p>
            <div class="confirm-btns">
                <button class="confirm-btn cancel" id="confirmCancelBtn">取消</button>
                <button class="confirm-btn danger" id="confirmOkBtn">确认恢复</button>
            </div>
        </div>
    </div>

    <script>
        /* Sortable Lite - 移动端优化：滚动/点击/长按拖拽三态分离 */
        (function(global) {
            'use strict';

            var STATE_IDLE = 'idle';
            var STATE_PENDING = 'pending';
            var STATE_SCROLLING = 'scrolling';
            var STATE_DRAGGING = 'dragging';

            var LONG_PRESS_DELAY = 500;
            var MOVE_THRESHOLD = 10;
            var SCROLL_SLOP = 8;
            var DRAG_THRESHOLD_PC = 6;

            function isInteractiveElement(target) {
                return Boolean(target.closest('button, input, select, textarea, label, a[href]'));
            }

            function getDragHandle(container, target, handleSelector) {
                if (!target || !container.contains(target)) return null;
                if (!handleSelector) return target.closest(':scope > *');
                var handle = target.closest(handleSelector);
                if (!handle || handle.parentElement !== container) return null;
                return handle;
            }

            function SortableLite(container, options) {
                this.container = container;
                this.options = options || {};
                this.state = STATE_IDLE;
                this.dragged = null;
                this.dragPlaceholder = null;
                this.pendingItem = null;
                this.longPressTimer = null;
                this.startX = 0;
                this.startY = 0;
                this.lastX = 0;
                this.lastY = 0;
                this.offsetX = 0;
                this.offsetY = 0;
                this.oldIndex = -1;
                this.suppressClick = false;
                this.touchId = null;

                this.touchMoveActiveOptions = { capture: true, passive: false };
                this.touchMovePassiveOptions = { capture: true, passive: true };

                this.onMouseDown = this.onMouseDown.bind(this);
                this.onMouseMove = this.onMouseMove.bind(this);
                this.onMouseUp = this.onMouseUp.bind(this);
                this.onTouchStart = this.onTouchStart.bind(this);
                this.onTouchMovePassive = this.onTouchMovePassive.bind(this);
                this.onTouchMoveActive = this.onTouchMoveActive.bind(this);
                this.onTouchEnd = this.onTouchEnd.bind(this);
                this.onClickCapture = this.onClickCapture.bind(this);

                container.addEventListener('mousedown', this.onMouseDown);
                container.addEventListener('touchstart', this.onTouchStart, { passive: true });
                container.addEventListener('click', this.onClickCapture, true);
            }

            SortableLite.prototype.items = function() {
                return Array.from(this.container.children);
            };

            SortableLite.prototype.cleanupTouchListeners = function() {
                document.removeEventListener('touchmove', this.onTouchMovePassive, this.touchMovePassiveOptions);
                document.removeEventListener('touchmove', this.onTouchMoveActive, this.touchMoveActiveOptions);
                document.removeEventListener('touchend', this.onTouchEnd, true);
                document.removeEventListener('touchcancel', this.onTouchEnd, true);
            };

            SortableLite.prototype.clearLongPressTimer = function() {
                if (this.longPressTimer) {
                    clearTimeout(this.longPressTimer);
                    this.longPressTimer = null;
                }
            };

            SortableLite.prototype.resetPending = function() {
                this.clearLongPressTimer();
                if (this.pendingItem) {
                    this.pendingItem.classList.remove('long-press-ready');
                    this.pendingItem = null;
                }
                if (this.options.onLongPressHint) {
                    this.options.onLongPressHint(false);
                }
            };

            SortableLite.prototype.onMouseDown = function(event) {
                if (event.button !== 0) return;
                var item = getDragHandle(this.container, event.target, this.options.handle);
                if (!item || isInteractiveElement(event.target)) return;

                this.startX = event.clientX;
                this.startY = event.clientY;
                this.lastX = event.clientX;
                this.lastY = event.clientY;

            SortableLite.prototype.onTouchStart = function(event) {

                this.pendingItem = item;
                this.startX = touch.clientX;
                this.startY = touch.clientY;
                this.lastX = touch.clientX;
                this.lastY = touch.clientY;
                this.suppressClick = false;

                item.classList.add('long-press-ready');
                if (this.options.onLongPressHint) {

            SortableLite.prototype.onTouchMovePassive = function(event) {

            SortableLite.prototype.onMouseMove = function(event) {

            SortableLite.prototype.onTouchMoveActive = function(event) {

                if (!touch) return;

                }
                this.lastX = touch.clientX;
                this.lastY = touch.clientY;
                this.positionDraggedItem(touch.clientX, touch.clientY);
                this.movePlaceholder(touch.clientX, touch.clientY);
            };

            SortableLite.prototype.enterDragMode = function(item, x, y, isTouch) {
                this.state = STATE_DRAGGING;

                }

                this.dragPlaceholder = placeholder;

                this.offsetX = x - rect.left;
                this.offsetY = y - rect.top;
                this.suppressClick = true;

                item.parentNode.replaceChild(placeholder, item);
                item.classList.add(this.options.dragClass || 'sortable-drag');
                item.style.width = rect.width + 'px';
                item.style.height = rect.height + 'px';
                item.style.position = 'fixed';
                item.style.left = '0';
                item.style.top = '0';
                item.style.margin = '0';
                item.style.zIndex = '1000';
                item.style.pointerEvents = 'none';
                item.style.boxSizing = 'border-box';
                item.style.transition = 'none';
                document.body.appendChild(item);

                this.positionDraggedItem(x, y);

                if (isTouch) {
                    document.removeEventListener('touchmove', this.onTouchMovePassive, this.touchMovePassiveOptions);
                    document.addEventListener('touchmove', this.onTouchMoveActive, this.touchMoveActiveOptions);
                }
            };

            SortableLite.prototype.positionDraggedItem = function(x, y) {
                if (!this.dragged) return;

            };

            SortableLite.prototype.movePlaceholder = function(x, y) {
                if (!this.dragPlaceholder) return;

                    return item !== this.dragPlaceholder;
                }, this);

                    var sibling = siblings[i];
                    var rect = sibling.getBoundingClientRect();
                    var beforeByRow = y < rect.top + rect.height / 2;
                    var withinRow = y >= rect.top && y <= rect.bottom;
                    var beforeByColumn = withinRow && x < rect.left + rect.width / 2;

                        }

                    }

            SortableLite.prototype.onMouseUp = function() {

            };

            SortableLite.prototype.onTouchEnd = function() {

            SortableLite.prototype.finishInteraction = function() {

                    var newIndex = this.items().indexOf(placeholder);

                    dragged.classList.remove(this.options.dragClass || 'sortable-drag', 'sorting', 'long-press-ready');
                    dragged.style.width = '';
                    dragged.style.height = '';
                    dragged.style.position = '';
                    dragged.style.left = '';
                    dragged.style.top = '';
                    dragged.style.margin = '';
                    dragged.style.zIndex = '';
                    dragged.style.pointerEvents = '';
                    dragged.style.boxSizing = '';
                    dragged.style.transition = '';
                    dragged.style.transform = '';
                    this.container.replaceChild(dragged, placeholder);

                    this.dragged = null;
                    this.dragPlaceholder = null;

                        this.options.onEnd({
                            item: dragged,

            };

            SortableLite.prototype.onClickCapture = function(event) {

    <script>
        (function() {
            'use strict';
            const LS_KEY = 'quickdial.v3.items';
            const LS_THEME = 'quickdial.theme';
            const LS_CARD_COLOR = 'quickdial.cardColor';
            const LS_CARD_SCALE = 'quickdial.cardScale';

            const PRESET_COLORS = [
                '#5b9bd5', '#4f8cff', '#3b82f6', '#6366f1', '#8b5cf6',
                '#a78bfa', '#ec4899', '#f472b6', '#22c55e', '#10b981',
                '#14b8a6', '#f59e0b', '#f97316', '#ef4444', '#6b7280'
            ];

            const CARTOON_COLORS = [
                '#FF9AA2', '#FFB7B2', '#FFDAC1', '#E2F0CB', '#B5EAD7',
                '#C7CEEA', '#F0C7E4', '#FFE0B2', '#B3E5FC', '#D1C4E9',
                '#FFCCBC', '#DCEDC8', '#F8BBD0', '#B2EBF2', '#FFECB3',
                '#FFE5B4', '#FFD1A9', '#FFAAA5', '#A8D8EA', '#D5C6E0'
            ];

            const ICON_FETCH_TIMEOUT = 3000;
            const IMG_LOAD_TIMEOUT = 2000;
            /* 图标自动发现接口地址（可选）：
               部署 functions/api/icon.js（Cloudflare Pages Function）后，
               接口为 https://<项目名>.pages.dev/api/icon，可自动解析网站
               <link rel="icon"> 显示 CDN 托管的真实图标（如 DeepSeek 平台的黑鲸）。
               留空则跳过该功能。 */
            const ICON_FINDER_API = 'https://dash-349.pages.dev/api/icon';

            const SCALE_MIN = 0.7;

            const SCALE_STEP = 0.1;
            const SCALE_DEFAULT = 1;

            let items = [];
            let editingId = null;
            let sortableInstance = null;
            let currentCardColor = '#5b9bd5';
            let colorPickerOpen = false;
            let cardScale = SCALE_DEFAULT;

            const grid = document.getElementById('grid');
            const dlg = document.getElementById('dlg');
            const fUrl = document.getElementById('fUrl');
            const fTitle = document.getElementById('fTitle');
            const fIcon = document.getElementById('fIcon');
            const themeToggle = document.getElementById('themeToggle');
            const btnAdd = document.getElementById('btnAdd');
            const btnExport = document.getElementById('btnExport');
            const btnImport = document.getElementById('btnImport');
            const fileImport = document.getElementById('fileImport');
            const dlgSave = document.getElementById('dlgSave');
            const dlgCancel = document.getElementById('dlgCancel');
            const colorTrigger = document.getElementById('colorTrigger');
            const colorDot = document.getElementById('colorDot');
            const colorPickerPopup = document.getElementById('colorPickerPopup');
            const presetColorsContainer = document.getElementById('presetColors');
            const themeLabel = document.getElementById('themeLabel');
            const switchContainer = document.getElementById('switchContainer');
            const btnSizeDown = document.getElementById('btnSizeDown');
            const btnSizeUp = document.getElementById('btnSizeUp');
            const btnSizeReset = document.getElementById('btnSizeReset');
            const btnResetDefaults = document.getElementById('btnResetDefaults');

            function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
            function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch (err) { console.warn('保存失败', err); } }
            function saveScale() { localStorage.setItem(LS_CARD_SCALE, String(cardScale)); }
            function loadScale() {
                const saved = parseFloat(localStorage.getItem(LS_CARD_SCALE));
                return (saved >= SCALE_MIN && saved <= SCALE_MAX) ? saved : SCALE_DEFAULT;
            }
            function getHost(url) { try { return new URL(url).host; } catch { return url; } }
            function defaultTitle(url) { const h = getHost(url); return h.replace(/^www\./, ''); }
            function guessIcon(url) { try { const u = new URL(url); return `${u.protocol}//${u.host}/favicon.ico`; } catch { return ''; } }
            function readBlobAsDataUrl(blob) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(reader.error);
                    reader.readAsDataURL(blob);

            }
            function fetchWithTimeout(url, timeoutMs = ICON_FETCH_TIMEOUT) {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
                return fetch(url, { cache: 'force-cache', referrerPolicy: 'no-referrer', signal: controller.signal })
                    .finally(() => clearTimeout(timeoutId));
            }
            function promiseAny(promises) {
                const arr = Array.from(promises);
                if (arr.length === 0) return Promise.reject(new AggregateError([], 'All promises were rejected'));
                return new Promise((resolve, reject) => {
                    let remaining = arr.length;
                    const errors = new Array(arr.length);
                    arr.forEach((p, i) => {
                        Promise.resolve(p).then(
                            val => resolve(val),
                            err => { errors[i] = err; remaining--; if (remaining === 0) reject(new AggregateError(errors, 'All promises were rejected')); }
                        );
                    });
                });
            }

            function applyCardScale(scale) {
                cardScale = Math.max(SCALE_MIN, Math.min(SCALE_MAX, scale));
                const root = document.documentElement;
                root.style.setProperty('--card-scale', cardScale);
                root.style.setProperty('--card-min-width', (160 * cardScale) + 'px');
                root.style.setProperty('--card-row-height', (120 * cardScale) + 'px');
                root.style.setProperty('--card-favicon-size', (32 * cardScale) + 'px');
                root.style.setProperty('--card-title-size', (14 * cardScale) + 'px');
                root.style.setProperty('--card-host-size', (11 * cardScale) + 'px');
                root.style.setProperty('--card-gap', (16 * cardScale) + 'px');
                const padV = Math.round(50 * cardScale);
                const padH = Math.round(18 * cardScale);
                const padB = Math.round(80 * cardScale);
                root.style.setProperty('--grid-padding', `${padV}px ${padH}px ${padB}px`);

                btnSizeDown.disabled = cardScale <= SCALE_MIN;
                btnSizeUp.disabled = cardScale >= SCALE_MAX;
                saveScale();
            }

            /* 卡通头像生成（渲染层回退使用） */
            function extractInitialChar(item) {
                const title = (item.title || '').trim();
                if (title) return title.charAt(0).toUpperCase();
                const host = getHost(item.url);
                if (host) return host.charAt(0).toUpperCase();
                return '?';
            }
            function getCartoonColor(char) { const code = char.charCodeAt(0) || 0; return CARTOON_COLORS[code % CARTOON_COLORS.length]; }
            function generateCartoonAvatar(char, size) {
                const actualSize = Math.round((size || 64) * cardScale);
                const canvas = document.createElement('canvas');
                canvas.width = actualSize; canvas.height = actualSize;
                const ctx = canvas.getContext('2d');
                const bgColor = getCartoonColor(char);
                const radius = Math.round(actualSize * 0.18);
                ctx.beginPath();
                ctx.moveTo(radius, 0); ctx.lineTo(actualSize - radius, 0);
                ctx.arcTo(actualSize, 0, actualSize, radius, radius); ctx.lineTo(actualSize, actualSize - radius);
                ctx.arcTo(actualSize, actualSize, actualSize - radius, actualSize, radius); ctx.lineTo(radius, actualSize);
                ctx.arcTo(0, actualSize, 0, actualSize - radius, radius); ctx.lineTo(0, radius);
                ctx.arcTo(0, 0, radius, 0, radius); ctx.closePath();
                ctx.fillStyle = bgColor; ctx.fill();
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(actualSize * 0.5, actualSize * 0.22, actualSize * 0.32, actualSize * 0.2, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
                ctx.restore();
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(actualSize * 0.5, actualSize * 0.78, actualSize * 0.25, actualSize * 0.14, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill();
                ctx.restore();
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const fontSize = Math.round(actualSize * 0.55);
                ctx.font = `bold ${fontSize}px "Arial Rounded MT Bold", "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif`;
                ctx.fillText(char, actualSize / 2, actualSize / 2);
                return canvas.toDataURL('image/png');
            }

            /* ---------- 图标缓存（仅保存真实图标） ---------- */
            async function fetchIconData(url) {
                if (!url) return '';
                const response = await fetchWithTimeout(url, ICON_FETCH_TIMEOUT);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const blob = await response.blob();
                if ((blob.type && !blob.type.startsWith('image/')) || blob.size > 150 * 1024) throw new Error('无效图片');
                return readBlobAsDataUrl(blob);
            }

            /* 通过 Cloudflare Worker 自动发现网站真实图标（解析 <link rel="icon">）
               返回图标完整 URL；未配置 Worker 或失败时返回空字符串 */
            async function discoverIconViaWorker(url) {
                if (!ICON_FINDER_API || !url) return '';
                const sep = ICON_FINDER_API.includes('?') ? '&' : '?';
                try {
                    const res = await fetchWithTimeout(ICON_FINDER_API + sep + 'url=' + encodeURIComponent(url), 8000);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    return (data && typeof data.icon === 'string' && data.icon) ? data.icon : '';
                } catch { return ''; }
            }

            async function cacheIconForItem(item) {
                if (!item || !item.url) return false;
                const candidates = [item.icon, guessIcon(item.url)];
                try {
                    const u = new URL(item.url);
                    candidates.push(`${u.protocol}//${u.host}/favicon.png`, `${u.protocol}//${u.host}/apple-touch-icon.png`);
                } catch {}
                const uniqueCandidates = Array.from(new Set(candidates.filter(Boolean)));
                let iconData = '';
                if (uniqueCandidates.length) {
                    try {
                        const fetchPromises = uniqueCandidates.map(url => fetchIconData(url).catch(() => { throw new Error('fail'); }));
                        iconData = await promiseAny(fetchPromises);
                    } catch { /* 全部失败 */ }
                }
                // 本地候选全部失败 → 通过 Worker 自动发现真实图标
                if (!iconData) {
                    const discovered = await discoverIconViaWorker(item.url);
                    if (discovered) {
                        item.icon = discovered;   // 持久化真实图标地址，后续渲染直接用
                        try { iconData = await fetchIconData(discovered); } catch { iconData = ''; }
                    }
                }
                if (iconData) {
                    item.iconData = iconData;
                    item.iconCachedFrom = 'fetched';
                    item.iconCachedAt = Date.now();
                    return true;
                }
                return false;
            }

            function shouldRefreshIconCache(item, url, icon) {
                return !item.iconData || item.url !== url || (item.icon || '') !== icon;
            }

            async function cacheMissingIcons() {
                const needCache = items.filter(it => it.url && !it.iconData);
                for (const item of needCache) {
                    const beforeIcon = item.icon || '';
                    const success = await cacheIconForItem(item);
                    // 成功缓存图标，或通过 Worker 发现了真实图标地址 → 都需保存并重渲染
                    if (success || item.icon !== beforeIcon) {
                        save();
                        render();
                    }
                }
            }

            /* ---------- 颜色 & 主题 ---------- */
            function hexToRgb(hex) { const clean = hex.replace('#', ''); return { r: parseInt(clean.substring(0,2),16), g: parseInt(clean.substring(2,4),16), b: parseInt(clean.substring(4,6),16) }; }
            function rgbToHex(r,g,b) { const clamp = v => Math.max(0, Math.min(255, Math.round(v))); return '#' + [clamp(r), clamp(g), clamp(b)].map(v => clamp(v).toString(16).padStart(2,'0')).join(''); }
            function adjustBrightness(hex, factor) { const {r,g,b} = hexToRgb(hex); return rgbToHex(r+(255-r)*(factor-1), g+(255-g)*(factor-1), b+(255-b)*(factor-1)); }
            function computeHoverColor(cardColor) { const isLight = document.documentElement.getAttribute('data-theme') === 'light'; return adjustBrightness(cardColor, isLight ? 0.75 : 1.25); }
            function applyCardColor(color) { document.documentElement.style.setProperty('--card', color); document.documentElement.style.setProperty('--card-hover', computeHoverColor(color)); if(colorDot) colorDot.style.backgroundColor = color; currentCardColor = color; }
            function loadCardColor() { const saved = localStorage.getItem(LS_CARD_COLOR); return saved && PRESET_COLORS.includes(saved) ? saved : (saved || '#5b9bd5'); }
            function saveCardColor(color) { localStorage.setItem(LS_CARD_COLOR, color); }
            function buildPresetColorButtons() {
                presetColorsContainer.innerHTML = '';
                PRESET_COLORS.forEach(color => {
                    const btn = document.createElement('button'); btn.type='button'; btn.className='preset-color-btn'; btn.style.backgroundColor = color; btn.title = color; btn.setAttribute('data-color', color);
                    if(color === currentCardColor) btn.classList.add('active');
                    btn.addEventListener('click', e => { e.stopPropagation(); selectCardColor(color); });
                    presetColorsContainer.appendChild(btn);
                });
            }
            function updatePresetActiveState() { presetColorsContainer.querySelectorAll('.preset-color-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-color') === currentCardColor)); }
            function selectCardColor(color) { currentCardColor = color; saveCardColor(color); applyCardColor(color); updatePresetActiveState(); closeColorPicker(); }
            function repositionColorPicker() {
                if(!colorPickerOpen) return;
                const trigger = colorTrigger, popup = colorPickerPopup;
                const triggerRect = trigger.getBoundingClientRect();
                const vw = window.innerWidth, vh = window.innerHeight, gap = 8;
                const popupHeight = popup.offsetHeight, popupWidth = popup.offsetWidth;
                let top, left;
                const spaceAbove = triggerRect.top, spaceBelow = vh - triggerRect.bottom;
                if(spaceAbove >= popupHeight + gap) top = triggerRect.top - popupHeight - gap;
                else if(spaceBelow >= popupHeight + gap) top = triggerRect.bottom + gap;
                else top = Math.max(gap, vh - popupHeight - gap);
                left = triggerRect.left + triggerRect.width/2 - popupWidth/2;

            function applyThemeFromStorage() {
                const t = localStorage.getItem(LS_THEME) || 'light';

                themeToggle.checked = (t === 'light');
                if(themeLabel) themeLabel.textContent = t === 'light' ? '浅色模式' : '暗色模式';
                applyCardColor(currentCardColor);
                if(colorDot) colorDot.style.backgroundColor = currentCardColor;
            }

            /* ---------- 渲染（带超时与快速回退） ---------- */
            function render() {
                grid.innerHTML = '';
                if(!items.length) {
                    grid.innerHTML = '<div class="empty">暂无快捷站点。点击<b>添加快捷站点</b>创建第一个。</div>';
                    if(sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }
                    return;
                }
                items.forEach(it => grid.appendChild(renderTile(it)));
                if(sortableInstance) sortableInstance.destroy();
                initSortable();
            }

            function renderTile(it) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.dataset.id = it.id;

                const icoWrap = document.createElement('div');
                icoWrap.className = 'favicon';
                const img = document.createElement('img');
                img.alt = '';
                img.referrerPolicy = 'no-referrer';
                img.loading = 'lazy';

                /* 图标候选源依次尝试，直到加载成功：
                   缓存图 → 手动填写的图标 → 猜 /favicon.ico → /favicon.png → /apple-touch-icon.png → 头像回退 */
                const iconCandidates = [];
                if (it.iconData) iconCandidates.push(it.iconData);
                if (it.icon) iconCandidates.push(it.icon);
                const guessed = guessIcon(it.url);
                if (guessed) iconCandidates.push(guessed);
                try {
                    const u = new URL(it.url);
                    iconCandidates.push(`${u.protocol}//${u.host}/favicon.png`, `${u.protocol}//${u.host}/apple-touch-icon.png`);
                } catch {}
                const uniqueCandidates = Array.from(new Set(iconCandidates.filter(Boolean)));

                const fallbackAvatarUrl = generateCartoonAvatar(extractInitialChar(it));
                let fallbackApplied = false;
                let candidateIndex = 0;
                let loadTimeout = null;
                let workerSearched = false;

                function armLoadTimeout() {
                    if (loadTimeout) clearTimeout(loadTimeout);
                    loadTimeout = setTimeout(() => {
                        if (!fallbackApplied) tryNextIconSource();
                    }, IMG_LOAD_TIMEOUT);
                }

                function tryNextIconSource() {
                    if (candidateIndex < uniqueCandidates.length) {
                        img.src = uniqueCandidates[candidateIndex++];
                        armLoadTimeout();
                    } else if (!fallbackApplied && !workerSearched) {
                        // 本地候选全部失败 → 通过 Worker 自动发现真实图标
                        workerSearched = true;
                        discoverIconViaWorker(it.url).then(realIcon => {
                            if (realIcon && !fallbackApplied && !uniqueCandidates.includes(realIcon)) {
                                uniqueCandidates.push(realIcon);
                                tryNextIconSource();
                            } else if (!fallbackApplied) {
                                fallbackApplied = true;
                                img.src = fallbackAvatarUrl;
                            }
                        }).catch(() => {
                            if (!fallbackApplied) {
                                fallbackApplied = true;
                                img.src = fallbackAvatarUrl;
                            }
                        });
                    } else if (!fallbackApplied) {
                        fallbackApplied = true;
                        img.src = fallbackAvatarUrl;
                    }
                }

                img.addEventListener('load', () => {
                    if (loadTimeout) clearTimeout(loadTimeout);
                    fallbackApplied = true;
                }, { once: true });

                img.addEventListener('error', () => {
                    if (loadTimeout) clearTimeout(loadTimeout);
                    if (!fallbackApplied) tryNextIconSource();
                });

                tryNextIconSource();

                icoWrap.appendChild(img);

                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = it.title || defaultTitle(it.url);

                const host = document.createElement('div');
                host.className = 'host';
                host.textContent = getHost(it.url);

                const actions = document.createElement('div');
                actions.className = 'actions';
                const btnEdit = document.createElement('button'); btnEdit.type='button'; btnEdit.className='iconbtn'; btnEdit.title='编辑'; btnEdit.innerHTML='<span class="icon">✎</span>';
                btnEdit.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); openEdit(it.id); });
                const btnDelete = document.createElement('button'); btnDelete.type='button'; btnDelete.className='iconbtn'; btnDelete.title='删除'; btnDelete.innerHTML='<span class="icon">✕</span>';
                btnDelete.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); remove(it.id); });
                actions.appendChild(btnEdit); actions.appendChild(btnDelete);

                tile.addEventListener('contextmenu', e => {
                    e.preventDefault();
                    document.querySelectorAll('.tile.actions-visible').forEach(t => t.classList.remove('actions-visible'));
                    tile.classList.add('actions-visible');
                });
                tile.addEventListener('click', e => {
                    if (e.target.closest('.actions')) return;
                    if (!tile.classList.contains('sortable-ghost') && !tile.classList.contains('sorting')) {
                        window.location.href = it.url;
                    }
                });

                tile.appendChild(icoWrap); tile.appendChild(title); tile.appendChild(host); tile.appendChild(actions);
                return tile;
            }

            function initSortable() {
                if(sortableInstance) sortableInstance.destroy();
                sortableInstance = Sortable.create(grid, {
                    ghostClass: 'sortable-ghost',
                    dragClass: 'sortable-drag',
                    handle: '.tile',
                    onSortStart: function(item) {
                        document.querySelectorAll('.tile.actions-visible').forEach(t => t.classList.remove('actions-visible'));
                    },
                    onEnd: () => {
                        const newOrder = Array.from(grid.querySelectorAll('.tile')).map(t => t.dataset.id);
                        items = newOrder.map(id => items.find(x => x.id === id)).filter(Boolean);
                        save();
                    }
                });
            }

            /* ---------- 对话框操作 ---------- */
            function openAdd() { editingId = null; document.getElementById('dlgTitle').textContent = '添加快捷站点'; fUrl.value = ''; fTitle.value = ''; fIcon.value = ''; dlg.showModal(); setTimeout(() => fUrl.focus(), 100); }
            function openEdit(id) {
                editingId = id; const it = items.find(x => x.id === id); if(!it) return;
                document.getElementById('dlgTitle').textContent = '编辑快捷站点';
                fUrl.value = it.url; fTitle.value = it.title || ''; fIcon.value = it.icon || '';
                dlg.showModal(); setTimeout(() => fUrl.focus(), 100);
            }

            async function upsertFromForm() {
                let url = fUrl.value.trim();
                // 省略协议头时自动补全 https://
                if(url && !/^https?:\/\//i.test(url)) { url = 'https://' + url; fUrl.value = url; }
                if(!/^https?:\/\//i.test(url)) { alert('请输入有效的 http(s) 网址。'); return false; }
                const title = fTitle.value.trim(); const icon = fIcon.value.trim();
                let item;
                if(editingId) {
                    const i = items.findIndex(x => x.id === editingId);
                    if(i >= 0) {
                        const existing = items[i];
                        const refreshIcon = shouldRefreshIconCache(existing, url, icon);
                        item = { ...existing, url, title, icon, iconData: refreshIcon ? '' : existing.iconData, iconCachedFrom: refreshIcon ? '' : existing.iconCachedFrom, iconCachedAt: refreshIcon ? 0 : existing.iconCachedAt };
                        items[i] = item;
                    }
                } else {
                    item = { id: uid(), url, title, icon, iconData: '', iconCachedFrom: '', iconCachedAt: 0, added: Date.now() };
                    items.push(item);
                }
                save();
                render();
                dlg.close();
                if(item && item.url && !item.iconData) {
                    setTimeout(async () => {
                        const success = await cacheIconForItem(item);
                        if(success) { save(); render(); }
                    }, 200);
                }
                return true;
            }

            function remove(id) { if(!confirm('确认删除？')) return; items = items.filter(x => x.id !== id); save(); render(); }

            function exportJson() {
                const blob = new Blob([JSON.stringify(items, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'quick-dial.json'; a.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }
            function importJson(file) {
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        if(!Array.isArray(parsed)) throw new Error('格式无效');
                        const map = new Map(items.map(x => [x.url, x]));
                        for(const p of parsed) {
                            if(!p || typeof p !== 'object' || !p.url) continue;
                            const rec = { id: p.id || uid(), url: String(p.url), title: String(p.title || ''), icon: String(p.icon || ''), iconData: String(p.iconData || ''), iconCachedFrom: String(p.iconCachedFrom || ''), iconCachedAt: Number(p.iconCachedAt || 0), added: Number(p.added || Date.now()) };
                            map.set(rec.url, rec);
                        }
                        items = Array.from(map.values());
                        save(); render();
                        cacheMissingIcons();
                    } catch(err) { alert('导入失败：' + err.message); }
                };
                reader.readAsText(file);
            }

            /* ---------- 初始化 ---------- */
            (function init() {
                /* ---------- 默认站点列表（HTML源码内置，修改此处并保存后：
                   file:// 本地打开每次加载强制读取最新内容；线上可通过"恢复出厂"按钮强制读取） ---------- */
                const DEFAULT_ITEMS = [
		{
  url: 'https://platform.deepseek.com/usage',
  title: 'Deepseek-api',
  icon: ''
},

                    { url: 'https://www.bing.com', title: 'Bing', icon: '' },
                    { url: 'https://github.com/', title: 'Github', icon: 'https://github.com/favicon.ico' },
                    { url: 'https://xuc.xi-xu.me/zh-hans.html', title: 'Xget转换器', icon: 'https://xuc.xi-xu.me/favicon.ico' },
                    { url: 'https://gitee.com/', title: 'Gitee', icon: 'https://gitee.com/favicon.ico' },
                    { url: 'https://wangpanmao.com/', title: '网盘猫', icon: 'https://wangpanmao.com/favicon.ico' },
                    { url: 'https://dash.cloudflare.com/2a56f1ee49b50d9b10a53e877c42d0dd/home', title: 'Cloudflare', icon: 'https://www.cloudflare.com/favicon.ico' },
                    { url: 'https://cs2-a40.pages.dev/', title: 'CS2实验室', icon: 'https://cs2-a40.pages.dev/favicon.ico' },
                    { url: 'https://vet-7tn.pages.dev/', title: '测试站', icon: 'https://vet-7tn.pages.dev/favicon.ico' },
                    { url: 'https://convertio.co/zh/download/18f1731a54cbde64262c1e7a958789bcfa32cd/', title: '图标转ico', icon: 'https://convertio.co/favicon.ico' },
                    { url: 'https://my-website01-aty.pages.dev/', title: '资源分享站', icon: 'https://my-website01-aty.pages.dev/favicon.ico' },
                    { url: 'https://dash-349.pages.dev/', title: 'Dashboard', icon: 'https://dash-349.pages.dev/favicon.ico' },
                ];

                function createDefaultItems() {
                    return DEFAULT_ITEMS.map(d => ({
                        id: uid(),
                        url: d.url,
                        title: d.title || defaultTitle(d.url),
                        icon: d.icon || '',
                        iconData: '', iconCachedFrom: '', iconCachedAt: 0,
                        added: Date.now()
                    }));
                }

                /* 恢复出厂：强制读取 HTML 源码最新默认站点列表，无视缓存标记 */
                function resetToDefaults() {
                    items = createDefaultItems();
                    localStorage.removeItem('quickdial.seeded');
                    save();
                    render();
                    cacheMissingIcons();
                }

                /* file:// 本地协议打开：每次加载强制读取 HTML 源码最新默认站点，无视旧缓存标记；
                   线上（http/https）：优先读取 LocalStorage 缓存 */
                if (typeof location !== 'undefined' && location.protocol === 'file:') {
                    items = createDefaultItems();
                    localStorage.removeItem('quickdial.seeded');
                    save();
                } else {
                    try { items = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { items = []; }
                    if (!items.length && !localStorage.getItem('quickdial.seeded')) {
                        items = createDefaultItems();
                        localStorage.setItem('quickdial.seeded', '1');
                        save();
                    }
                }
                currentCardColor = loadCardColor();
                cardScale = loadScale();
                applyCardScale(cardScale);
                applyThemeFromStorage();
                if(colorDot) colorDot.style.backgroundColor = currentCardColor;
                buildPresetColorButtons();
                render();

                btnSizeDown.addEventListener('click', () => applyCardScale(cardScale - SCALE_STEP));
                btnSizeUp.addEventListener('click', () => applyCardScale(cardScale + SCALE_STEP));
                btnSizeReset.addEventListener('click', () => applyCardScale(SCALE_DEFAULT));

                document.addEventListener('click', e => {
                    document.querySelectorAll('.tile.actions-visible').forEach(t => t.classList.remove('actions-visible'));
                    if(colorPickerOpen && !switchContainer.contains(e.target)) closeColorPicker();
                });
                colorTrigger.addEventListener('click', e => toggleColorPicker(e));
                colorPickerPopup.addEventListener('click', e => e.stopPropagation());
                dlgSave.addEventListener('click', async () => {
                    dlgSave.disabled = true; const oldText = dlgSave.textContent; dlgSave.textContent = '保存中...';
                    try { await upsertFromForm(); } catch { alert('保存失败'); }
                    finally { dlgSave.disabled = false; dlgSave.textContent = oldText; }
                });
                dlgCancel.addEventListener('click', () => dlg.close());
                btnAdd.addEventListener('click', openAdd);
                btnExport.addEventListener('click', exportJson);
                btnImport.addEventListener('click', () => fileImport.click());
                fileImport.addEventListener('change', () => { const f = fileImport.files?.[0]; if(f) importJson(f); fileImport.value = ''; });
                themeToggle.addEventListener('change', () => {
                    const theme = themeToggle.checked ? 'light' : 'dark';
                    localStorage.setItem(LS_THEME, theme); applyThemeFromStorage();
                    if(colorDot) colorDot.style.backgroundColor = currentCardColor;
                    buildPresetColorButtons(); updatePresetActiveState();
                });
                window.addEventListener('keydown', e => {
                    if(e.key.toLowerCase() === 'n' && !dlg.open) openAdd();
                    if(e.key === 'Escape' && colorPickerOpen) closeColorPicker();
                });

                dlg.addEventListener('close', () => { dlgSave.disabled = false; dlgSave.textContent = '保存'; });

                /* 网址输入完成后自动获取 favicon 并回填图标网址（复用 Worker 图标接口，弹窗 UI 不变） */
                let autoFillLastUrl = '';   /* 上次已查询网址，避免重复请求 */
                let autoFillApplied = '';   /* 上次自动填入的图标值，允许被新结果覆盖 */
                let autoFillSeq = 0;        /* 竞态防护：仅应用最新一次请求的结果 */

                function autoFillIcon() {
                    let raw = fUrl.value.trim().replace(/\s+/g, '');
                    if(!raw) return;
                    if(!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;  /* 裸域名自动补协议 */
                    let u;
                    try { u = new URL(raw); } catch { return; }
                    if(u.href === autoFillLastUrl) return;
                    autoFillLastUrl = u.href;

                    /* 用户已手动填写图标地址时不覆盖；为空或等于上次自动填入值时才回填 */
                    const cur = fIcon.value.trim();
                    if(cur && cur !== autoFillApplied) return;

                    const seq = ++autoFillSeq;
                    discoverIconViaWorker(u.href).then(icon => {
                        if(seq !== autoFillSeq || !icon) return;
                        autoFillApplied = icon;
                        fIcon.value = icon;
                    });
                }

                fUrl.addEventListener('change', autoFillIcon);  /* 失焦且值有变化时触发 */
                fUrl.addEventListener('keydown', e => { if(e.key === 'Enter') { e.preventDefault(); autoFillIcon(); } });

                /* 恢复出厂确认弹窗 */
                const confirmOverlay = document.getElementById('confirmOverlay');
                const confirmOkBtn = document.getElementById('confirmOkBtn');
                const confirmCancelBtn = document.getElementById('confirmCancelBtn');

                function openResetConfirm() { confirmOverlay.classList.add('show'); confirmOkBtn.focus(); }
                function closeResetConfirm() { confirmOverlay.classList.remove('show'); }

                btnResetDefaults.addEventListener('click', openResetConfirm);
                confirmOkBtn.addEventListener('click', () => {
                    closeResetConfirm();
                    resetToDefaults();
                });
                confirmCancelBtn.addEventListener('click', closeResetConfirm);
                confirmOverlay.addEventListener('click', e => {
                    if (e.target === confirmOverlay) closeResetConfirm();
                });
                window.addEventListener('keydown', e => {
                    if (e.key === 'Escape' && confirmOverlay.classList.contains('show')) closeResetConfirm();
                });

                /* 刷新网页按钮 */
                const btnReloadPage = document.getElementById('btnReloadPage');
                btnReloadPage.addEventListener('click', () => { location.reload(); });

                cacheMissingIcons();
            })();
        })();
    </script>
    <script>
        /* ==================== 网页防护 ==================== */
        (function() {
            'use strict';
            /* 拦截快捷键：F12、Ctrl+S、Ctrl+U、Ctrl+Shift+I/J/C 等 */
            document.addEventListener('keydown', function(e) {
                var key = e.key || '';
                var blocked = false;
                if (key === 'F12') { blocked = true; }
                else if ((e.ctrlKey || e.metaKey) && !e.altKey && (key === 's' || key === 'S' || key === 'u' || key === 'U')) { blocked = true; }
                else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'I' || key === 'i' || key === 'J' || key === 'j' || key === 'C' || key === 'c')) { blocked = true; }
                if (blocked) { e.preventDefault(); e.stopPropagation(); return false; }
            }, true);
            /* 屏蔽右键菜单 */
            document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);
            /* 反调试：debugger 检测循环（打开控制台时触发中断） */
            function antiDebug() {
                setInterval(function() {
                    var before = Date.now();
                    /* eslint-disable no-debugger */
                    debugger;
                    if (Date.now() - before > 100) { document.body.innerHTML = ''; }
                }, 2000);
            }
            antiDebug();
        })();
    </script>
</body>
